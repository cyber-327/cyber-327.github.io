<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Resonant selectivity and retuning</title>
  <desc id="desc">A band-pass response favors a desired tone near resonance over an off-channel interferer. Changing capacitance shifts the response peak.</desc>
  <defs><style>.axis{stroke:#173f4f;stroke-width:4}.curve{fill:none;stroke:#b54d2e;stroke-width:6}.curve2{fill:none;stroke:#2c7a73;stroke-width:5;stroke-dasharray:14 10}.mark{stroke:#173f4f;stroke-width:3}.title{font:700 28px Georgia,serif;fill:#173f4f}.text{font:21px Georgia,serif;fill:#2d3b40}.note{font:700 19px Georgia,serif;fill:#8a351f}</style></defs>
  <rect width="1100" height="620" fill="#fffdf8"/>
  <text class="title" x="550" y="60" text-anchor="middle">Measured channel selectivity</text>
  <line class="axis" x1="120" y1="500" x2="1000" y2="500"/><line class="axis" x1="120" y1="500" x2="120" y2="110"/>
  <text class="text" x="560" y="555" text-anchor="middle">Frequency</text><text class="text" x="38" y="305" transform="rotate(-90 38 305)" text-anchor="middle">Vout / Vin</text>
  <path class="curve" d="M140 480 C300 475 380 430 470 190 C505 105 555 105 590 190 C680 430 760 475 980 480"/>
  <path class="curve2" d="M140 485 C400 480 500 445 650 205 C690 140 745 140 785 205 C875 405 920 470 980 480"/>
  <line class="mark" x1="525" y1="500" x2="525" y2="125"/><text class="text" x="525" y="95" text-anchor="middle">original f0</text>
  <line class="mark" x1="715" y1="500" x2="715" y2="155"/><text class="text" x="765" y="125">retuned f0</text>
  <line class="mark" x1="250" y1="500" x2="250" y2="445"/><text class="text" x="250" y="420" text-anchor="middle">off-channel</text>
  <text class="note" x="550" y="595" text-anchor="middle">Measure the response. Do not assume an ideal curve or exact rejection.</text>
</svg>
