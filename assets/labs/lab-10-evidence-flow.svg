<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Lab 10 independent activities</title><desc id="desc">Each team completes line coding, local and remote AM reception, and cellular placement, in its assigned order.</desc><rect width="1000" height="440" fill="#f7f3ea"/><g font-family="sans-serif" fill="#173b5e"><text x="40" y="50" font-size="28">Lab 10: three independent activities</text><text x="40" y="83" font-size="18">Rotate in your assigned order; keep evidence for your individual report.</text><rect x="40" y="130" width="290" height="185" rx="12" fill="#173b5e"/><g fill="white"><text x="58" y="172" font-size="23">Line coding</text><text x="58" y="216" font-size="16">Nano → oscilloscope</text><text x="58" y="259" font-size="15">Compare codes; decode one byte</text></g><rect x="355" y="130" width="290" height="185" rx="12" fill="#173b5e"/><g fill="white"><text x="373" y="172" font-size="23">AM reception</text><text x="373" y="216" font-size="16">Local RTL-SDR + remote WebSDR</text><text x="373" y="259" font-size="15">Compare evidence and reception</text></g><rect x="670" y="130" width="290" height="185" rx="12" fill="#173b5e"/><g fill="white"><text x="688" y="172" font-size="23">Backup-link review</text><text x="688" y="216" font-size="16">Three-day log → Excel</text><text x="688" y="259" font-size="15">Test delivery and radio quality</text></g><text x="40" y="369" font-size="18">Complete all three activities and keep the evidence for your report.</text><text x="40" y="405" font-size="17">CH1 data D9 • CH2 marker D2 • common Nano GND • 10 ms per bit</text></g></svg>