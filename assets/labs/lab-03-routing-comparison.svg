<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Breadboard crosstalk comparisons</title>
  <desc id="desc">Three panels show the parallel baseline, a ninety-degree conductor crossing, and a lower neighbor-line resistance. Students change only one variable in each comparison.</desc>
  <rect width="1100" height="620" fill="#fffdf8"/>
  <rect x="30" y="65" width="330" height="455" rx="16" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/><rect x="385" y="65" width="330" height="455" rx="16" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/><rect x="740" y="65" width="330" height="455" rx="16" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/>
  <text x="195" y="110" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#173f4f">1. Parallel baseline</text>
  <path d="M75 225 H315" fill="none" stroke="#b54d2e" stroke-width="6"/><path d="M75 310 H315" fill="none" stroke="#167b80" stroke-width="6"/>
  <text x="195" y="380" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#2d3b40">High neighbor resistance</text><text x="195" y="415" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#2d3b40">Measure baseline crosstalk</text>
  <text x="550" y="110" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#173f4f">2. Change the path</text>
  <path d="M430 270 H670" fill="none" stroke="#b54d2e" stroke-width="6"/><path d="M550 155 V390" fill="none" stroke="#167b80" stroke-width="6"/>
  <text x="550" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#2d3b40">Cross at approximately 90 degrees</text><text x="550" y="462" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#2d3b40">Keep the high neighbor resistance</text>
  <text x="905" y="110" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="700" fill="#173f4f">3. Change the receiver</text>
  <path d="M785 225 H1025" fill="none" stroke="#b54d2e" stroke-width="6"/><path d="M785 310 H1025" fill="none" stroke="#167b80" stroke-width="6"/>
  <rect x="845" y="350" width="120" height="60" rx="9" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/><text x="905" y="387" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#2d3b40">Lower R</text>
  <text x="905" y="450" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#2d3b40">Restore parallel placement</text><text x="905" y="482" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#2d3b40">Change only neighbor resistance</text>
  <text x="550" y="575" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-weight="700" fill="#8a351f">Keep source settings and oscilloscope settings fixed; change only the stated variable.</text>
</svg>
