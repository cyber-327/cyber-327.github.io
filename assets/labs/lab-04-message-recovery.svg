<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Lab 4 message-recovery station wiring</title>
  <desc id="desc">The computer connects to AUX IN on a passive interface. BNC LEFT OUT drives the RLC filter through a BNC-to-banana adapter. The filter output returns through a second adapter to BNC LEFT IN. AUX OUT connects to the powered speaker. Both oscilloscope channels share circuit common.</desc>
  <defs>
    <style>.box{fill:#f7f2e8;stroke:#173f4f;stroke-width:3}.wire{fill:none;stroke:#173f4f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.signal{fill:none;stroke:#b54d2e;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.title{font:700 31px Georgia,serif;fill:#173f4f}.label{font:700 21px Georgia,serif;fill:#173f4f}.text{font:18px Georgia,serif;fill:#2d3b40}.note{font:700 18px Georgia,serif;fill:#8a351f}.small{font:16px Georgia,serif;fill:#2d3b40}</style>
  </defs>
  <rect width="1200" height="720" fill="#fffdf8"/>
  <text class="title" x="600" y="52" text-anchor="middle">Part 2: Message-recovery station</text>

  <rect class="box" x="30" y="175" width="170" height="140" rx="14" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/>
  <text class="label" x="115" y="220" text-anchor="middle">Computer</text>
  <text class="text" x="115" y="254" text-anchor="middle">Composite WAV</text>
  <text class="text" x="115" y="284" text-anchor="middle">Volume starts low</text>

  <path class="signal" d="M200 245 H260" fill="none" stroke="#b54d2e" stroke-width="5"/>
  <text class="small" x="230" y="230" text-anchor="middle">AUX cable</text>

  <rect class="box" x="260" y="145" width="225" height="200" rx="14" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/>
  <text class="label" x="372" y="185" text-anchor="middle">AUX/BNC box</text>
  <text class="text" x="372" y="225" text-anchor="middle">Computer → AUX IN</text>
  <text class="text" x="372" y="265" text-anchor="middle">Use BNC LEFT OUT</text>
  <text class="small" x="372" y="303" text-anchor="middle">RIGHT OUT remains unused</text>

  <path class="signal" d="M485 245 H570" fill="none" stroke="#b54d2e" stroke-width="5"/>
  <text class="small" x="527" y="225" text-anchor="middle">BNC + adapter</text>

  <rect class="box" x="570" y="135" width="230" height="220" rx="14" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/>
  <text class="label" x="685" y="180" text-anchor="middle">Student RLC filter</text>
  <text class="text" x="685" y="220" text-anchor="middle">Red/center → IN</text>
  <text class="text" x="685" y="252" text-anchor="middle">Black/shield → common</text>
  <text class="text" x="685" y="296" text-anchor="middle">Take output across R</text>
  <text class="small" x="685" y="326" text-anchor="middle">OUT + common</text>

  <path class="signal" d="M800 245 H885" fill="none" stroke="#b54d2e" stroke-width="5"/>
  <text class="small" x="842" y="225" text-anchor="middle">Adapter + BNC</text>

  <rect class="box" x="885" y="145" width="285" height="200" rx="14" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/>
  <text class="label" x="1027" y="185" text-anchor="middle">AUX/BNC box</text>
  <text class="text" x="1027" y="225" text-anchor="middle">Use BNC LEFT IN</text>
  <text class="text" x="1027" y="265" text-anchor="middle">AUX OUT → speaker</text>
  <text class="small" x="1027" y="303" text-anchor="middle">Same interface box as at left</text>

  <path class="signal" d="M1027 345 V405" fill="none" stroke="#b54d2e" stroke-width="5"/>
  <rect class="box" x="920" y="405" width="215" height="100" rx="14" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/>
  <text class="label" x="1027" y="445" text-anchor="middle">Powered speaker</text>
  <text class="text" x="1027" y="477" text-anchor="middle">AUX input</text>

  <rect class="box" x="450" y="440" width="370" height="120" rx="14" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/>
  <text class="label" x="635" y="480" text-anchor="middle">Oscilloscope</text>
  <text class="text" x="635" y="515" text-anchor="middle">CH1 = filter IN | CH2 = filter OUT</text>
  <text class="small" x="635" y="542" text-anchor="middle">Both ground clips connect to common</text>
  <path class="wire" d="M570 245 H530 V440" fill="none" stroke="#173f4f" stroke-width="5"/>
  <path class="wire" d="M800 245 H840 V500 H820" fill="none" stroke="#173f4f" stroke-width="5"/>

  <path class="wire" d="M330 600 H1030" fill="none" stroke="#173f4f" stroke-width="5"/>
  <text class="text" x="680" y="590" text-anchor="middle">COMMON: both BNC shields, filter common, and both scope grounds</text>
  <text class="note" x="600" y="665" text-anchor="middle">Disconnect the function generator before connecting the computer. Leave both RIGHT BNC connectors unused.</text>
</svg>
