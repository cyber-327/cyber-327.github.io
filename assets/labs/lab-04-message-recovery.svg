<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Wired Morse message-recovery signal path</title>
  <desc id="desc">A computer sends a prerecorded composite audio signal through a passive AUX-to-BNC interface into the student RLC filter. An oscilloscope compares input and filtered output, and a powered speaker connected to the filter output makes the recovered Morse word audible.</desc>
  <defs>
    <style>.box{fill:#f7f2e8;stroke:#173f4f;stroke-width:3}.wire{fill:none;stroke:#173f4f;stroke-width:5}.signal{fill:none;stroke:#b54d2e;stroke-width:5}.title{font:700 29px Georgia,serif;fill:#173f4f}.label{font:700 22px Georgia,serif;fill:#173f4f}.text{font:18px Georgia,serif;fill:#2d3b40}.note{font:700 19px Georgia,serif;fill:#8a351f}</style>
  </defs>
  <rect width="1200" height="620" fill="#fffdf8"/>
  <text class="title" x="600" y="55" text-anchor="middle">Message-recovery station</text>

  <rect class="box" x="35" y="180" width="190" height="145" rx="14"/>
  <text class="label" x="130" y="225" text-anchor="middle">Computer</text>
  <text class="text" x="130" y="260" text-anchor="middle">Morse carrier +</text>
  <text class="text" x="130" y="286" text-anchor="middle">out-of-band tones</text>

  <path class="signal" d="M225 252 H300"/>
  <rect class="box" x="300" y="180" width="205" height="145" rx="14"/>
  <text class="label" x="402" y="225" text-anchor="middle">Passive AUX</text>
  <text class="label" x="402" y="255" text-anchor="middle">to BNC box</text>
  <text class="text" x="402" y="290" text-anchor="middle">One channel + common</text>

  <path class="signal" d="M505 252 H585"/>
  <rect class="box" x="585" y="160" width="225" height="185" rx="14"/>
  <text class="label" x="697" y="212" text-anchor="middle">Student RLC</text>
  <text class="label" x="697" y="242" text-anchor="middle">band-pass filter</text>
  <text class="text" x="697" y="282" text-anchor="middle">IN: composite signal</text>
  <text class="text" x="697" y="309" text-anchor="middle">OUT: across R</text>

  <path class="signal" d="M810 252 H885"/>
  <rect class="box" x="885" y="180" width="275" height="145" rx="14"/>
  <text class="label" x="1022" y="225" text-anchor="middle">Powered speaker</text>
  <text class="text" x="1022" y="260" text-anchor="middle">AUX INPUT only</text>
  <text class="text" x="1022" y="290" text-anchor="middle">Listen and decode</text>

  <rect class="box" x="485" y="430" width="430" height="105" rx="14"/>
  <text class="label" x="700" y="472" text-anchor="middle">Oscilloscope</text>
  <text class="text" x="700" y="507" text-anchor="middle">CH1 = composite IN | CH2 = filtered OUT</text>
  <path class="wire" d="M550 252 V430"/>
  <path class="wire" d="M850 252 V430"/>

  <path class="wire" d="M130 350 H1022"/>
  <text class="text" x="575" y="380" text-anchor="middle">COMMON: source, filter, scope grounds, and speaker-input sleeve</text>
  <text class="note" x="600" y="585" text-anchor="middle">Disconnect the function generator before attaching the computer source.</text>
</svg>
