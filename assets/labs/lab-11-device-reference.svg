<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
<title id="title">DC11 panel and door circuit schematic revision D</title>
<desc id="desc">Two separately USB-powered classic 5 V Nanos with common ground. Panel D5 TX connects to Door A5 RX. Door D5 TX connects to Panel A5 RX. Door D4 drives the red LOCKED LED through R1 1 kohm. Door D6 drives the green OPEN LED through R2 1 kohm. Each LED cathode connects to ground.</desc>
