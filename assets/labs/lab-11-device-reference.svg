<text x="50" y="760" class="label" font-weight="bold">Assembly notes</text>
<text x="50" y="795" class="small">1. Disconnect USB power before assembly. Keep the two 5 V supply pins separate; join GND only.</text>
<text x="50" y="827" class="small">2. Each LED uses its own series resistor. Anode (A) faces the resistor; cathode (K) returns to GND.</text>
<text x="50" y="859" class="small">3. D0 / D1 remain reserved for the onboard USB–serial interface. Pin positions are schematic, not physical layout.</text>
