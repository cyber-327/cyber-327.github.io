<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040"><rect width="1200" height="1040" fill="#08141e"/><g font-family="Arial, sans-serif"><text x="28" y="45" fill="#edf5f7" font-size="30">DC-11 • Device Reference</text><text x="28" y="77" fill="#a7c1ca" font-size="18">Wired Interception CTF</text><rect x="40" y="120" width="220" height="90" rx="8" fill="#173b4d" stroke="#71e1cc"/><text x="150" y="155" fill="#fff" font-size="21" text-anchor="middle">PANEL</text><text x="150" y="183" fill="#b9dce3" font-size="16" text-anchor="middle">D9 TX / D8 RX</text><rect x="930" y="120" width="220" height="90" rx="8" fill="#173b4d" stroke="#71e1cc"/><text x="1040" y="155" fill="#fff" font-size="21" text-anchor="middle">DOOR</text><text x="1040" y="183" fill="#b9dce3" font-size="16" text-anchor="middle">D8 RX / D9 TX</text><rect x="480" y="205" width="220" height="90" rx="8" fill="#173b4d" stroke="#71e1cc"/><text x="590" y="240" fill="#fff" font-size="21" text-anchor="middle">LISTENER</text><text x="590" y="268" fill="#b9dce3" font-size="16" text-anchor="middle">D8 tap / D9 disconnected</text><path d="M260 145 H930 M260 185 H930 M590 145 V205" fill="none" stroke="#ffbb70" stroke-width="3"/><text x="420" y="135" fill="#fff" font-size="16">LOCK traffic →</text><text x="700" y="178" fill="#fff" font-size="16">← response</text><circle cx="590" cy="145" r="6" fill="#71e1cc"/><rect x="28" y="340" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="366" fill="#71e1cc" font-size="19" font-weight="700">WIRE LINK</text><text x="48" y="392" fill="#edf5f7" font-size="17">PANEL D9 → DOOR D8</text><text x="48" y="415" fill="#edf5f7" font-size="17">DOOR D9 → PANEL D8</text><text x="48" y="438" fill="#edf5f7" font-size="17">All GND pins share one rail; 5 V pins stay separate.</text><rect x="28" y="470" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="496" fill="#71e1cc" font-size="19" font-weight="700">PASSIVE TAP</text><text x="48" y="522" fill="#edf5f7" font-size="17">LISTENER D8 → PANEL D9 / DOOR D8 junction</text><text x="48" y="545" fill="#edf5f7" font-size="17">LISTENER D9 remains disconnected</text><text x="48" y="568" fill="#edf5f7" font-size="17">Scope CH1 tip → signal; scope ground → GND.</text><rect x="28" y="600" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="626" fill="#71e1cc" font-size="19" font-weight="700">INJECTION</text><text x="48" y="652" fill="#edf5f7" font-size="17">Remove PANEL D9 before connecting LISTENER D9 → DOOR D8</text><text x="48" y="675" fill="#edf5f7" font-size="17">Receiver USB console displays acceptance and flag</text><text x="48" y="698" fill="#edf5f7" font-size="17">Power off before rewiring; never join two TX outputs.</text><rect x="28" y="730" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="756" fill="#71e1cc" font-size="19" font-weight="700">FRAME REGISTER</text><text x="48" y="782" fill="#edf5f7" font-size="17">U | device | action | access code + newline</text><text x="48" y="805" fill="#edf5f7" font-size="17">Actions: LOCK / OPEN. Eight data bits, no parity, one stop bit.</text><text x="48" y="828" fill="#edf5f7" font-size="17">Data travels least significant bit first; measure the wire speed.</text><rect x="28" y="860" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="886" fill="#71e1cc" font-size="19" font-weight="700">CONSOLE REGISTER</text><text x="48" y="912" fill="#edf5f7" font-size="17">All USB consoles: 115200 baud, Newline</text><text x="48" y="935" fill="#edf5f7" font-size="17">Listener: HELP / BAUD value / SEND frame</text><text x="48" y="958" fill="#edf5f7" font-size="17">Door: HELP / STATUS / RESET. Panel also supports START / STOP.</text><text x="30" y="1025" fill="#a7c1ca" font-size="15">Indicators, if fitted: D4 red / A5 green, each through its own 1 kohm resistor to GND.</text></g></svg>