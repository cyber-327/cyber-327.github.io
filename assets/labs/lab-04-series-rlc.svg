<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Series RLC band-pass measurement circuit</title>
  <desc id="desc">A function generator drives a series inductor, capacitor, and resistor. Channel one measures input voltage and channel two measures resistor output voltage relative to common.</desc>
  <defs><style>.box{fill:#f7f2e8;stroke:#173f4f;stroke-width:3}.wire{fill:none;stroke:#173f4f;stroke-width:4}.accent{fill:none;stroke:#b54d2e;stroke-width:4}.label{font:700 25px Georgia,serif;fill:#173f4f}.text{font:20px Georgia,serif;fill:#2d3b40}.note{font:700 19px Georgia,serif;fill:#8a351f}</style></defs>
  <rect width="1100" height="620" fill="#fffdf8"/>
  <rect class="box" x="45" y="195" width="190" height="150" rx="14"/><text class="label" x="140" y="250" text-anchor="middle">Function</text><text class="label" x="140" y="283" text-anchor="middle">generator</text><text class="text" x="140" y="320" text-anchor="middle">Sine · 0 V offset</text>
  <path class="accent" d="M235 235 H330"/><path class="accent" d="M330 235 c12-45 28-45 40 0 c12-45 28-45 40 0 c12-45 28-45 40 0 c12-45 28-45 40 0"/><text class="label" x="410" y="155" text-anchor="middle">L</text>
  <path class="accent" d="M490 235 H585 M585 185 V285 M625 185 V285 M625 235 H735"/><text class="label" x="605" y="155" text-anchor="middle">C</text>
  <path class="accent" d="M735 235 H820 V285 l-30 15 60 30-60 30 60 30-30 15 V470"/><text class="label" x="885" y="355">R</text><text class="text" x="885" y="385">Vout across R</text>
  <path class="wire" d="M820 470 H140 V345"/><line class="wire" x1="785" y1="505" x2="855" y2="505"/><line class="wire" x1="798" y1="525" x2="842" y2="525"/><line class="wire" x1="810" y1="545" x2="830" y2="545"/>
  <rect class="box" x="335" y="390" width="300" height="115" rx="14"/><text class="label" x="485" y="433" text-anchor="middle">Oscilloscope</text><text class="text" x="485" y="470" text-anchor="middle">CH1 = Vin · CH2 = Vout</text>
  <path class="wire" d="M330 235 V390"/><path class="wire" d="M820 285 H685 V450 H635"/><path class="wire" d="M485 505 V545 H820"/>
  <text class="note" x="550" y="590" text-anchor="middle">Both probe ground clips connect only to circuit common.</text>
</svg>
