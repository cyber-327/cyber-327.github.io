<text x="445" y="556" font-size="19" font-weight="bold">Common GND for TX, RX and scope probes</text>
<rect x="40" y="605" width="1120" height="175" rx="12" fill="#e8edf3" stroke="#173b5e"/>
<text x="65" y="643" font-size="23" font-weight="bold">DSOX2012A measurement map</text>
<text x="65" y="679" font-size="20">Timing check: CH1 → SYNC_RX; measure one symbol interval in Normal mode.</text>
<text x="65" y="714" font-size="20">I/Q view: CH1 → I_RX (X); CH2 → Q_RX (Y). DC coupling; matching 10× factors.</text>
<text x="65" y="749" font-size="20">X–Y: Horiz → Time Mode → XY. Time order: return to Normal mode.</text>
<rect x="40" y="815" width="1120" height="165" rx="12" fill="#fff0db" stroke="#d47432"/>
<text x="65" y="852" font-size="22" font-weight="bold">Optional settled-point display</text>
<text x="65" y="886" font-size="19">RX D7 • BLANK → 2.2 kΩ series / 10 kΩ to GND → rear EXT TRIG.</text>
<text x="65" y="920" font-size="19">Low displays X–Y; high blanks the trace. Keep the ground at common GND.</text>
<text x="65" y="954" font-size="19">No capacitor on SYNC or BLANK. Use only the prepared leads; do not join board outputs.</text>
<text x="42" y="1016" font-size="17">USB power only. 33 µF: + to signal, − to GND. Disconnect power before circuit changes; check levels before use.</text>
</g></svg>
