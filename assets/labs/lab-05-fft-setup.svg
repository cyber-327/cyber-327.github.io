<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Known-source FFT measurement setup</title>
  <desc id="desc">A function generator connects directly to an oscilloscope. Students verify a waveform in time view, then preserve FFT source, span, units, window, and averaging settings.</desc>
  <defs><style>.box{fill:#f7f2e8;stroke:#173f4f;stroke-width:3}.wire{fill:none;stroke:#b54d2e;stroke-width:5}.label{font:700 26px Georgia,serif;fill:#173f4f}.text{font:21px Georgia,serif;fill:#2d3b40}.small{font:19px Georgia,serif;fill:#2d3b40}.note{font:700 19px Georgia,serif;fill:#8a351f}</style></defs>
  <rect width="1100" height="620" fill="#fffdf8"/>
  <rect class="box" x="60" y="190" width="260" height="190" rx="15"/><text class="label" x="190" y="245" text-anchor="middle">Known generator</text><text class="text" x="190" y="295" text-anchor="middle">Sine · Square · Triangle</text><text class="small" x="190" y="335" text-anchor="middle">Same f0 and measured Vpp</text>
  <path class="wire" d="M320 260 H500"/><path class="wire" d="M500 330 H320"/><text class="text" x="410" y="235" text-anchor="middle">signal</text><text class="text" x="410" y="365" text-anchor="middle">ground</text>
  <rect class="box" x="500" y="105" width="530" height="390" rx="15"/><text class="label" x="765" y="155" text-anchor="middle">Oscilloscope evidence path</text>
  <rect class="box" x="550" y="205" width="190" height="175" rx="12"/><path class="wire" d="M575 295 C600 235 625 355 650 295 S700 235 720 295"/><text class="text" x="645" y="410" text-anchor="middle">1. Stable time view</text>
  <rect class="box" x="800" y="205" width="180" height="175" rx="12"/><line x1="825" y1="345" x2="955" y2="345" stroke="#173f4f" stroke-width="3"/><line x1="850" y1="345" x2="850" y2="245" stroke="#b54d2e" stroke-width="7"/><line x1="895" y1="345" x2="895" y2="292" stroke="#b54d2e" stroke-width="6"/><line x1="940" y1="345" x2="940" y2="318" stroke="#b54d2e" stroke-width="5"/><text class="text" x="890" y="410" text-anchor="middle">2. FFT features</text>
  <text class="note" x="550" y="565" text-anchor="middle">Record source, span, units, window, averaging, probe factor, and vertical scale.</text>
</svg>
