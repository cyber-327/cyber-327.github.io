<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040"><rect width="1200" height="1040" fill="#08141e"/><g font-family="Arial, sans-serif"><text x="28" y="45" fill="#edf5f7" font-size="30">DC-12 • Device Reference</text><text x="28" y="77" fill="#a7c1ca" font-size="18">Infrared Relay CTF</text><rect x="20" y="150" width="220" height="90" rx="8" fill="#173b4d" stroke="#71e1cc"/><text x="130" y="185" fill="#fff" font-size="21" text-anchor="middle">READER</text><text x="130" y="213" fill="#b9dce3" font-size="16" text-anchor="middle">IR TX + RX</text><rect x="330" y="150" width="220" height="90" rx="8" fill="#173b4d" stroke="#71e1cc"/><text x="440" y="185" fill="#fff" font-size="21" text-anchor="middle">RELAY-R</text><text x="440" y="213" fill="#b9dce3" font-size="16" text-anchor="middle">IR TX + RX</text><rect x="650" y="150" width="220" height="90" rx="8" fill="#173b4d" stroke="#71e1cc"/><text x="760" y="185" fill="#fff" font-size="21" text-anchor="middle">RELAY-K</text><text x="760" y="213" fill="#b9dce3" font-size="16" text-anchor="middle">IR TX + RX</text><rect x="960" y="150" width="220" height="90" rx="8" fill="#173b4d" stroke="#71e1cc"/><text x="1070" y="185" fill="#fff" font-size="21" text-anchor="middle">KEY</text><text x="1070" y="213" fill="#b9dce3" font-size="16" text-anchor="middle">IR TX + RX</text><path d="M240 195 H330 M550 195 H650 M870 195 H960" stroke="#ffbb70" stroke-width="4"/><path d="M600 110 V290" stroke="#fff" stroke-dasharray="7 7"/><text x="265" y="180" fill="#fff" font-size="16">IR</text><text x="570" y="180" fill="#fff" font-size="16">wire</text><text x="890" y="180" fill="#fff" font-size="16">IR</text><text x="575" y="310" fill="#fff" font-size="16">opaque partition</text><rect x="28" y="340" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="366" fill="#71e1cc" font-size="19" font-weight="700">OPTICAL TOPOLOGY</text><text x="48" y="392" fill="#edf5f7" font-size="17">READER ⇄ RELAY-R   ║ opaque partition ║   RELAY-K ⇄ KEY</text><text x="48" y="415" fill="#edf5f7" font-size="17">Direct READER ⇄ KEY path must stay blocked for relay trials.</text><text x="48" y="438" fill="#edf5f7" font-size="17">Each local optical pair needs a request path AND a response path.</text><rect x="28" y="470" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="496" fill="#71e1cc" font-size="19" font-weight="700">EACH IR NODE</text><text x="48" y="522" fill="#edf5f7" font-size="17">Receiver module SIGNAL → D2; transmitter module SIGNAL → D3</text><text x="48" y="545" fill="#edf5f7" font-size="17">Use verified VCC/GND markings and module supply rating.</text><text x="48" y="568" fill="#edf5f7" font-size="17">A bare IR LED needs a suitable driver; a module pin is not a power output.</text><rect x="28" y="600" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="626" fill="#71e1cc" font-size="19" font-weight="700">WIRED TUNNEL</text><text x="48" y="652" fill="#edf5f7" font-size="17">RELAY-R D9 → RELAY-K D8; RELAY-K D9 → RELAY-R D8</text><text x="48" y="675" fill="#edf5f7" font-size="17">Join relay grounds; do not join 5 V pins. Tunnel: 9600 baud.</text><text x="48" y="698" fill="#edf5f7" font-size="17">IR uses a 38 kHz carrier; the carrier is not the tunnel baud rate.</text><rect x="28" y="730" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="756" fill="#71e1cc" font-size="19" font-weight="700">CONSOLE REGISTER</text><text x="48" y="782" fill="#edf5f7" font-size="17">USB: 115200 baud, Newline. READER: OPEN / LOCK / HELP</text><text x="48" y="805" fill="#edf5f7" font-size="17">Both relays: BRIDGE ON / BRIDGE OFF / CAPTURE / REPLAY / HELP</text><text x="48" y="828" fill="#edf5f7" font-size="17">Results and flag appear on READER. Bridges start OFF.</text><rect x="28" y="860" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="886" fill="#71e1cc" font-size="19" font-weight="700">MESSAGE REGISTER</text><text x="48" y="912" fill="#edf5f7" font-size="17">Byte 0: 01=request / 02=response; byte 1: version 01; byte 2: device; byte 3: 01=OPEN</text><text x="48" y="935" fill="#edf5f7" font-size="17">Bytes 4–7 boot counter; 8–11 request counter (little endian)</text><text x="48" y="958" fill="#edf5f7" font-size="17">A response repeats these fields and appends a 32-byte keyed tag.</text><text x="30" y="1025" fill="#a7c1ca" font-size="15">Indicators, if fitted: D4 red / A5 green, each through its own 1 kohm resistor to GND.</text></g></svg>