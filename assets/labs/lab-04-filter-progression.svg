<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Series-RLC band-pass measurement circuit</title>
  <desc id="desc">A two volt peak-to-peak sine-wave source drives a one microfarad capacitor, a 2.9 millihenry inductor, and a ten ohm resistor in series. Channel 1 measures input relative to common. Channel 2 measures output across the resistor relative to common.</desc>
  <defs>
    <style>.panel{fill:#f7f2e8;stroke:#173f4f;stroke-width:3}.wire{fill:none;stroke:#173f4f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.part{fill:none;stroke:#b54d2e;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.title{font:700 31px Georgia,serif;fill:#173f4f}.label{font:700 22px Georgia,serif;fill:#173f4f}.text{font:19px Georgia,serif;fill:#2d3b40}.note{font:700 19px Georgia,serif;fill:#8a351f}.probe{fill:none;stroke:#d28b21;stroke-width:4;stroke-dasharray:10 8}</style>
  </defs>
  <rect width="1200" height="720" fill="#fffdf8"/>
  <text class="title" x="600" y="52" text-anchor="middle">Series-RLC band-pass measurement</text>

  <rect class="panel" x="40" y="165" width="230" height="180" rx="16" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/>
  <text class="label" x="155" y="210" text-anchor="middle">Function generator</text>
  <text class="text" x="155" y="250" text-anchor="middle">Sine | 2 Vpp | 0 V</text>
  <text class="text" x="155" y="282" text-anchor="middle">High-Z display mode</text>
  <text class="text" x="155" y="314" text-anchor="middle">Output off while wiring</text>

  <path class="wire" d="M270 225 H350" fill="none" stroke="#173f4f" stroke-width="5"/>
  <circle cx="330" cy="225" r="7" fill="#b54d2e"/>
  <text class="label" x="330" y="200" text-anchor="middle">IN</text>

  <path class="part" d="M350 175 V275 M405 175 V275" fill="none" stroke="#b54d2e" stroke-width="5"/>
  <path class="wire" d="M405 225 H470" fill="none" stroke="#173f4f" stroke-width="5"/>
  <text class="label" x="378" y="145" text-anchor="middle">C = 1.00 µF</text>

  <path class="part" d="M470 225 c14-48 34-48 48 0 c14-48 34-48 48 0 c14-48 34-48 48 0 c14-48 34-48 48 0" fill="none" stroke="#b54d2e" stroke-width="5"/>
  <path class="wire" d="M662 225 H735" fill="none" stroke="#173f4f" stroke-width="5"/>
  <text class="label" x="566" y="145" text-anchor="middle">L = 2.9 mH</text>
  <text class="text" x="566" y="174" text-anchor="middle">winding resistance ≈ 5 Ω</text>

  <circle cx="735" cy="225" r="8" fill="#b54d2e"/>
  <text class="label" x="735" y="195" text-anchor="middle">OUT</text>
  <path class="part" d="M735 225 V290 l-26 15 52 26-52 26 52 26-26 15 V455" fill="none" stroke="#b54d2e" stroke-width="5"/>
  <text class="label" x="790" y="350">R = 10 Ω</text>

  <path class="wire" d="M735 455 H155 V345" fill="none" stroke="#173f4f" stroke-width="5"/>
  <circle cx="330" cy="455" r="7" fill="#173f4f"/>
  <text class="label" x="330" y="492" text-anchor="middle">COMMON</text>

  <rect class="panel" x="855" y="175" width="300" height="245" rx="16" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/>
  <text class="label" x="1005" y="218" text-anchor="middle">Oscilloscope</text>
  <text class="text" x="1005" y="262" text-anchor="middle">CH1 tip → IN</text>
  <text class="text" x="1005" y="293" text-anchor="middle">CH2 tip → OUT</text>
  <text class="text" x="1005" y="337" text-anchor="middle">Both ground clips</text>
  <text class="text" x="1005" y="368" text-anchor="middle">→ COMMON</text>
  <path class="probe" d="M855 250 H810 V110 H330 V218" fill="none" stroke="#d28b21" stroke-width="4" stroke-dasharray="10 8"/>
  <path class="probe" d="M855 302 H820 V225 H743" fill="none" stroke="#d28b21" stroke-width="4" stroke-dasharray="10 8"/>
  <path class="probe" d="M855 365 H820 V455 H338" fill="none" stroke="#d28b21" stroke-width="4" stroke-dasharray="10 8"/>

  <rect class="panel" x="235" y="555" width="730" height="105" rx="16" fill="#f7f2e8" stroke="#173f4f" stroke-width="3"/>
  <text class="note" x="600" y="595" text-anchor="middle">Keep amplitude fixed. Sweep: 500 Hz | 1.7 kHz | 3.0 kHz | 5.2 kHz | 8.0 kHz</text>
  <text class="text" x="600" y="630" text-anchor="middle">Record measured Vin, measured Vout, and Vout / Vin at every frequency.</text>
</svg>
