<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040"><rect width="1200" height="1040" fill="#08141e"/><g font-family="Arial, sans-serif"><text x="28" y="45" fill="#edf5f7" font-size="30">DC-13 • Device Reference</text><text x="28" y="77" fill="#a7c1ca" font-size="18">Electromagnetic Interception and Media Security</text><rect x="20" y="150" width="220" height="90" rx="8" fill="#173b4d" stroke="#71e1cc"/><text x="130" y="185" fill="#fff" font-size="21" text-anchor="middle">SOURCE</text><text x="130" y="213" fill="#b9dce3" font-size="16" text-anchor="middle">D9 / GND</text><rect x="960" y="150" width="220" height="90" rx="8" fill="#173b4d" stroke="#71e1cc"/><text x="1070" y="185" fill="#fff" font-size="21" text-anchor="middle">SCOPE CH1</text><text x="1070" y="213" fill="#b9dce3" font-size="16" text-anchor="middle">BNC or probe</text><path d="M240 172 H350 V140 H440 V260 H350 V220 H332 M292 220 H240" fill="none" stroke="#ffbb70" stroke-width="4"/><rect x="292" y="212" width="40" height="16" fill="#08141e" stroke="#fff"/><text x="260" y="256" fill="#fff" font-size="16">1 kohm</text><path d="M825 169 A55 55 0 1 0 825 231" fill="none" stroke="#71e1cc" stroke-width="4"/><path d="M825 169 H960 M825 231 H960" stroke="#71e1cc" stroke-width="3"/><text x="470" y="175" fill="#fff" font-size="17">changing field</text><text x="470" y="210" fill="#fff" font-size="17">NO wire connection</text><text x="700" y="285" fill="#fff" font-size="16">pickup loop</text><rect x="28" y="340" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="366" fill="#71e1cc" font-size="19" font-weight="700">CURRENT PATH</text><text x="48" y="392" fill="#edf5f7" font-size="17">Nano D9 → outgoing wire → 1 kohm resistor → return wire → GND</text><text x="48" y="415" fill="#edf5f7" font-size="17">The resistor stays in the circuit for every layout comparison.</text><text x="48" y="438" fill="#edf5f7" font-size="17">D9 drives a 100 kHz square wave; stop/power off before rewiring.</text><rect x="28" y="470" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="496" fill="#71e1cc" font-size="19" font-weight="700">PICKUP PATH</text><text x="48" y="522" fill="#edf5f7" font-size="17">Separate wire coil → BNC center / shield → scope CH1</text><text x="48" y="545" fill="#edf5f7" font-size="17">OR passive probe ground clip joined to its own tip, forming a loop</text><text x="48" y="568" fill="#edf5f7" font-size="17">Do not connect the pickup to the source. Support it without metal contact.</text><rect x="28" y="600" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="626" fill="#71e1cc" font-size="19" font-weight="700">CHARACTER FORMAT</text><text x="48" y="652" fill="#edf5f7" font-size="17">10 ms carrier burst + 10 ms silence → eight data bursts</text><text x="48" y="675" fill="#edf5f7" font-size="17">MSB first: 0 = 2 ms burst; 1 = 4 ms burst; 2 ms gap after each bit</text><text x="48" y="698" fill="#edf5f7" font-size="17">100 ms gap after each character; longer silence after the full message.</text><rect x="28" y="730" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="756" fill="#71e1cc" font-size="19" font-weight="700">SOURCE CONSOLE</text><text x="48" y="782" fill="#edf5f7" font-size="17">USB: 115200 baud, Newline; HELP / STOP / TONE</text><text x="48" y="805" fill="#edf5f7" font-size="17">PATTERN sends ASCII U; MESSAGE sends the hidden code</text><text x="48" y="828" fill="#edf5f7" font-size="17">CHECK code verifies a recovered message; it does not supply it.</text><rect x="28" y="860" width="1144" height="116" rx="8" fill="#101f2b" stroke="#7dabb6"/><text x="48" y="886" fill="#71e1cc" font-size="19" font-weight="700">ISOLATED SOURCE</text><text x="48" y="912" fill="#edf5f7" font-size="17">Power off; fit D2 → GND jumper; power from a USB battery</text><text x="48" y="935" fill="#edf5f7" font-size="17">The startup jumper selects MESSAGE without a computer connection.</text><text x="48" y="958" fill="#edf5f7" font-size="17">Keep scope and generator reference leads disconnected from the source.</text><text x="30" y="1025" fill="#a7c1ca" font-size="15">Keep the 1 kohm resistor in series with the source loop.</text></g></svg>